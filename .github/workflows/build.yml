name: Build and Notarize macOS App

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Pin to macos-26 (Tahoe) so binaries are built against the macOS 26
    # SDK — same as developer's local environment. `macos-latest` resolves
    # to macos-15 (Sequoia) at time of writing, which still triggers
    # SwiftUI behavior-compat shims for MenuBarExtra panel sizing when the
    # binary is run on Tahoe.
    runs-on: macos-26
    
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

    steps:
      - name: Require release credentials and a new tag
        if: env.IS_RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
          MAC_CERTS_P12_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD }}
          MAC_CERTS_P12_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for name in APPLE_ID APPLE_TEAM_ID APP_SPECIFIC_PASSWORD SPARKLE_EDDSA_KEY MAC_CERTS_P12_PASSWORD MAC_CERTS_P12_BASE64; do
            if [ -z "${!name}" ]; then
              echo "Missing required release secret: $name" >&2
              exit 1
            fi
          done
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must have the form vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          # Fail closed for API errors; only a 404 means there is no release.
          response=$(gh api -i "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" 2> "$RUNNER_TEMP/release-check-error") && status=0 || status=$?
          if [ "$status" -eq 0 ]; then
            echo "A release for $GITHUB_REF_NAME already exists; refusing to modify it." >&2
            exit 1
          fi
          if ! printf '%s\n' "$response" | head -1 | grep -Eq '^HTTP/[0-9.]+ 404([[:space:]]|$)'; then
            echo "Could not establish whether the release already exists:" >&2
            printf '%s\n' "$response" >&2
            cat "$RUNNER_TEMP/release-check-error" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          # latest-stable picks the newest GA Xcode preinstalled on the
          # runner, which matches the developer's local SDK and avoids
          # SDK-skew SwiftUI compat shims on newer host OS versions.
          xcode-version: 'latest-stable'

      - name: Install Build Tools
        run: brew install xcodegen create-dmg

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Install Apple Certificate
        if: env.IS_RELEASE == 'true'
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.MAC_CERTS_P12_PASSWORD }}
        run: |
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(uuidgen)

          # Decode the p12 certificate from base64 secret
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $CERTIFICATE_PATH

          # Create and configure temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate to keychain
          security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH
          
          # Apply partition list to prevent UI permission prompts
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

      - name: Build Universal App (arm64 + x86_64)
        run: |
          xcodebuild -project CCSwitcher.xcodeproj \
            -scheme CCSwitcher \
            -configuration Release \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build \
            SYMROOT=$(PWD)/build

      - name: Verify built app version and build
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          PLIST=build/Release/CCSwitcher.app/Contents/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          if [ "$VERSION" != "${GITHUB_REF_NAME#v}" ] || [[ ! "$BUILD" =~ ^[1-9][0-9]*$ ]]; then
            echo "Tag $GITHUB_REF_NAME does not match built version $VERSION, or build $BUILD is invalid." >&2
            exit 1
          fi
          echo "Built version: $VERSION ($BUILD)"

      - name: Sign App
        if: env.IS_RELEASE == 'true'
        run: |
          # Order matters: every nested binary inside Sparkle.framework must be
          # signed BEFORE the framework itself, otherwise sealing the framework
          # captures unsigned content and `codesign --verify --deep --strict`
          # reports "nested code is modified or invalid". An earlier find-based
          # walk had the wrong order plus symlink double-signing problems; the
          # explicit list below matches Sparkle's own distribution recipe.
          # `--preserve-metadata=entitlements` keeps each helper's bundled
          # entitlements (we must not clobber Sparkle's installer entitlements).
          APP=build/Release/CCSwitcher.app
          IDENTITY="Developer ID Application"
          SPARKLE_V="$APP/Contents/Frameworks/Sparkle.framework/Versions/B"

          for nested in \
            "$SPARKLE_V/XPCServices/Downloader.xpc" \
            "$SPARKLE_V/XPCServices/Installer.xpc" \
            "$SPARKLE_V/Updater.app" \
            "$SPARKLE_V/Autoupdate" \
            "$APP/Contents/Frameworks/Sparkle.framework"; do
            if [ -e "$nested" ]; then
              codesign --force --options runtime --timestamp \
                --sign "$IDENTITY" \
                --preserve-metadata=identifier,entitlements,flags \
                "$nested"
            fi
          done

          # Widget extension with its own entitlements file
          codesign --force --options runtime --sign "$IDENTITY" --timestamp \
            --entitlements CCSwitcherWidget/Resources/CCSwitcherWidget.entitlements \
            "$APP/Contents/Extensions/CCSwitcherWidgetExtension.appex"

          # Main app
          codesign --force --options runtime --sign "$IDENTITY" --timestamp \
            --entitlements CCSwitcher/Resources/CCSwitcher.entitlements \
            "$APP"

          # Verify everything is correctly sealed for notarization
          codesign --verify --deep --strict --verbose=2 "$APP"

      - name: Create DMG
        run: |
          cd build/Release
          # Create DMG
          create-dmg \
            --volname "CCSwitcher" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "CCSwitcher.app" 150 190 \
            --hide-extension "CCSwitcher.app" \
            --app-drop-link 450 190 \
            "CCSwitcher.dmg" \
            "CCSwitcher.app"

      - name: Sign DMG
        if: env.IS_RELEASE == 'true'
        run: |
          cd build/Release
          codesign --force --sign "Developer ID Application" --timestamp CCSwitcher.dmg

      - name: Notarize DMG
        if: env.IS_RELEASE == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_SPECIFIC_PASSWORD: ${{ secrets.APP_SPECIFIC_PASSWORD }}
        run: |
          cd build/Release
          set -euo pipefail
          xcrun notarytool submit CCSwitcher.dmg \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_SPECIFIC_PASSWORD" \
            --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
          python3 - "$RUNNER_TEMP/notary-result.json" <<'PYNOTARY'
          import json, pathlib, sys
          result = json.loads(pathlib.Path(sys.argv[1]).read_text())
          print(f"Notarization status: {result.get('status')}, id: {result.get('id')}")
          if result.get('status') != 'Accepted':
              raise SystemExit('Notarization was not accepted')
          PYNOTARY

      - name: Staple Ticket to DMG
        if: env.IS_RELEASE == 'true'
        run: |
          cd build/Release
          xcrun stapler staple CCSwitcher.dmg
          xcrun stapler validate CCSwitcher.dmg

      - name: Download Sparkle tools
        if: env.IS_RELEASE == 'true'
        run: |
          SPARKLE_VERSION="2.9.0"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar -xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"

      - name: Prepare release notes
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          MD="$RUNNER_TEMP/release_notes.md"
          HTML="$RUNNER_TEMP/release_notes.html"

          # Single source of truth: the committed RELEASE_NOTES.md (written by
          # the /release flow before tagging). Fall back to GitHub's generated
          # notes, then git log, so a release is never note-less.
          if [ -f RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md "$MD"
          else
            PREV_TAG=$(git tag -l 'v*' --sort=-v:refname | grep -v "${GITHUB_REF_NAME}" | head -1 || true)
            NOTES=""
            if [ -n "$PREV_TAG" ]; then
              NOTES=$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
                -f tag_name="${GITHUB_REF_NAME}" -f previous_tag_name="${PREV_TAG}" \
                --jq '.body' 2>/dev/null || true)
              if [ -z "$NOTES" ]; then
                NOTES=$(git log "${PREV_TAG}..HEAD" --pretty=format:'- %s' --no-merges 2>/dev/null || true)
              fi
            fi
            [ -z "$NOTES" ] && NOTES="Bug fixes and improvements."
            printf '%s\n' "$NOTES" > "$MD"
          fi

          # Render to GitHub-flavored HTML for the Sparkle update dialog.
          if ! gh api --method POST /markdown -f mode=gfm -f text="$(cat "$MD")" > "$HTML" 2> "$RUNNER_TEMP/md_err.log" || [ ! -s "$HTML" ]; then
            echo "WARN: gh /markdown render failed; using escaped <pre> fallback. gh stderr:"
            cat "$RUNNER_TEMP/md_err.log" 2>/dev/null || true
            python3 -c 'import html,sys; print("<pre>"+html.escape(open(sys.argv[1]).read())+"</pre>")' "$MD" > "$HTML"
          fi

          echo "--- release_notes.html ---"
          cat "$HTML"

      - name: Sign DMG with Sparkle EdDSA + generate appcast.xml
        if: env.IS_RELEASE == 'true'
        env:
          SPARKLE_EDDSA_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          set -e
          cd build/Release

          # Sparkle's sign_update expects the base64 of the raw 32-byte Ed25519
          # seed. If the user accidentally stored the longer 64-byte seed+public
          # concatenation as the secret, strip back to the first 32 bytes. The
          # public half of the libsodium "secret key" can always be re-derived
          # from the seed, so dropping it is lossless.
          KEY_FILE=$(mktemp)
          DECODED_LEN=$(printf '%s' "$SPARKLE_EDDSA_KEY" | base64 -d 2>/dev/null | wc -c | tr -d ' ')
          case "$DECODED_LEN" in
            32)
              printf '%s' "$SPARKLE_EDDSA_KEY" > "$KEY_FILE"
              ;;
            64)
              echo "Note: SPARKLE_EDDSA_KEY decoded to 64 bytes; truncating to first 32 (raw seed) for sign_update."
              printf '%s' "$SPARKLE_EDDSA_KEY" | base64 -d | head -c 32 | base64 > "$KEY_FILE"
              ;;
            *)
              echo "ERROR: SPARKLE_EDDSA_KEY decoded length is $DECODED_LEN bytes; expected 32 or 64."
              rm -f "$KEY_FILE"
              exit 1
              ;;
          esac

          # Capture both stdout and stderr so any sign_update failure surfaces
          # in the action log instead of being swallowed by $() substitution.
          if ! SIGN_OUTPUT=$("$RUNNER_TEMP/sparkle/bin/sign_update" CCSwitcher.dmg -f "$KEY_FILE" 2>&1); then
            echo "ERROR: sign_update exited non-zero. Output:"
            echo "$SIGN_OUTPUT"
            rm -f "$KEY_FILE"
            exit 1
          fi
          rm -f "$KEY_FILE"

          echo "sign_update output: $SIGN_OUTPUT"
          ED_SIGNATURE=$(echo "$SIGN_OUTPUT" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          if [ -z "$ED_SIGNATURE" ]; then
            echo "ERROR: could not parse sparkle:edSignature from sign_update output"
            exit 1
          fi

          PLIST=CCSwitcher.app/Contents/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          PUBLIC_KEY=$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$PLIST")
          # Verify the signature against the public key embedded in this app.
          swift - "$PUBLIC_KEY" "$ED_SIGNATURE" CCSwitcher.dmg <<'SWIFT'
          import Foundation
          import CryptoKit
          let args = CommandLine.arguments
          guard let publicKey = Data(base64Encoded: args[1]),
                let signature = Data(base64Encoded: args[2]) else {
              fatalError("Invalid Sparkle public key or signature encoding")
          }
          let key = try Curve25519.Signing.PublicKey(rawRepresentation: publicKey)
          let archive = try Data(contentsOf: URL(fileURLWithPath: args[3]), options: .mappedIfSafe)
          guard key.isValidSignature(signature, for: archive) else {
              fatalError("Sparkle signature does not match the app's public key")
          }
          print("Sparkle signature verified against the built app's public key")
          SWIFT
          FILE_LENGTH=$(stat -f%z CCSwitcher.dmg)
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/CCSwitcher.dmg"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S +0000")

          # Read the rendered notes (Prepare release notes step). Build the
          # appcast with an echo block instead of a heredoc so the HTML never
          # gets shell-expanded inside the CDATA section.
          # Neutralize any literal CDATA terminator in the rendered HTML so a
          # release note containing `]]>` (e.g. a code snippet) can't break the
          # appcast XML.
          RELEASE_NOTES_HTML=$(sed 's/]]>/]]\&gt;/g' "$RUNNER_TEMP/release_notes.html")
          {
            echo '<?xml version="1.0" encoding="utf-8"?>'
            echo '<rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle">'
            echo '  <channel>'
            echo '    <title>CCSwitcher Updates</title>'
            echo "    <link>https://github.com/${GITHUB_REPOSITORY}/releases.atom</link>"
            echo '    <item>'
            echo "      <title>Version ${VERSION}</title>"
            echo "      <description><![CDATA[${RELEASE_NOTES_HTML}]]></description>"
            echo "      <pubDate>${PUB_DATE}</pubDate>"
            echo "      <sparkle:version>${BUILD}</sparkle:version>"
            echo "      <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>"
            echo '      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>'
            echo "      <enclosure url=\"${DOWNLOAD_URL}\" length=\"${FILE_LENGTH}\" type=\"application/octet-stream\" sparkle:edSignature=\"${ED_SIGNATURE}\" />"
            echo '    </item>'
            echo '  </channel>'
            echo '</rss>'
          } > appcast.xml

          echo "Generated appcast.xml:"
          cat appcast.xml

          # Never publish a malformed Sparkle feed: fail the build instead.
          xmllint --noout appcast.xml

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCSwitcher-macOS
          path: build/Release/CCSwitcher.dmg

      - name: Verify release files and checksums
        if: env.IS_RELEASE == 'true'
        run: |
          set -euo pipefail
          cd build/Release
          shasum -a 256 CCSwitcher.dmg appcast.xml > SHA256SUMS
          shasum -a 256 -c SHA256SUMS
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' CCSwitcher.app/Contents/Info.plist)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' CCSwitcher.app/Contents/Info.plist)
          python3 - "$VERSION" "$BUILD" <<'PYVERIFY'
          import os, pathlib, sys, xml.etree.ElementTree as ET
          version, build = sys.argv[1:]
          ns = {'s': 'http://www.andymatuschak.org/xml-namespaces/sparkle'}
          item = ET.parse('appcast.xml').find('./channel/item')
          assert item is not None
          assert item.findtext('s:version', namespaces=ns) == build
          assert item.findtext('s:shortVersionString', namespaces=ns) == version == os.environ['GITHUB_REF_NAME'][1:]
          enclosure = item.find('enclosure')
          assert enclosure is not None
          assert enclosure.get('url') == f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/releases/download/{os.environ['GITHUB_REF_NAME']}/CCSwitcher.dmg"
          assert enclosure.get('length') == str(pathlib.Path('CCSwitcher.dmg').stat().st_size)
          assert enclosure.get('{http://www.andymatuschak.org/xml-namespaces/sparkle}edSignature')
          PYVERIFY

      - name: Create and publish a new release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The API creates a new draft atomically. It fails if the tag already
          # has a release, so an existing release can never be overwritten.
          RELEASE_ID=$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
            -f tag_name="$GITHUB_REF_NAME" -f name="$GITHUB_REF_NAME" \
            -F draft=true -f body="$(cat "$RUNNER_TEMP/release_notes.md")" --jq .id)
          for file in CCSwitcher.dmg appcast.xml SHA256SUMS; do
            gh api --method POST \
              -H 'Content-Type: application/octet-stream' \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$file" \
              --input "build/Release/$file" --silent
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" > "$RUNNER_TEMP/release-assets.json"
          python3 - "$RUNNER_TEMP/release-assets.json" <<'PYASSETS'
          import json, pathlib, sys
          assets = json.loads(pathlib.Path(sys.argv[1]).read_text())
          expected = {name: pathlib.Path('build/Release', name).stat().st_size for name in ('CCSwitcher.dmg', 'appcast.xml', 'SHA256SUMS')}
          actual = {asset['name']: asset['size'] for asset in assets if asset['state'] == 'uploaded'}
          if actual != expected:
              raise SystemExit(f'Release assets do not match: {actual} != {expected}')
          PYASSETS
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent
